services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - API_KEY=${API_KEY}
      - WATERMARK=false
    expose:
      - "8080"        # widoczne TYLKO w sieci dockera, nie na świat
    networks:
      - cv-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - cv-net        # ta sama sieć co pdf-app, żeby tunel widział obie apki

networks:
  cv-net:
    external: true
    name: cv-net
