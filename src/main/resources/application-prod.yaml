app:
  features:
    sample-data: false
    watermark: true        # stamp "paczeklab.pl" on the CV (preview + server PDF)
  pdf:
    server-side: true      # render the downloadable PDF with headless Chrome
    pool-size: 1           # number of reusable Chromium workers

langchain4j:
  open-ai:
    chat-model:
      api-key: ${API_KEY}
      model-name: gemini-3.1-flash-lite
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
