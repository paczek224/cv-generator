kind: Application

spring:
  application:
    name: cv-ai-generator
  profiles:
    active: dev
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/cv-generator}

logging:
  level:
    root: WARN
    com.paczek224.cvaigenerator: INFO

playwright:
  base-url: http://localhost:8080
  browser: chromium
  browserWidth: 1920
  browserHeight: 1080
  headless: true
  timeoutInMs: 8000
  longTimeoutInMs: 20000