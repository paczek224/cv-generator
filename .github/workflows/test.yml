name: e2e-tests
on: [push, workflow_dispatch]

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Install Playwright OS dependencies
        run: sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps chromium"

      - name: Start application (dev profile)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          nohup mvn -B -DskipTests spring-boot:run -Dspring-boot.run.profiles=dev > app.log 2>&1 &
          echo "Waiting for app on http://localhost:8080 ..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null; then
              echo "Application is up"
              exit 0
            fi
            sleep 5
          done
          echo "Application did not start in time"
          cat app.log
          exit 1

      - name: Run e2e tests (dev profile)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: mvn -B clean test -Dtest=RegressionSuiteTest -Dspring.profiles.active=dev

      - name: Generate Allure report
        id: allure
        if: always()
        run: mvn -B allure:report

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: gh-pages
